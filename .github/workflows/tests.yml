name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest tests -q
      - name: Report regenerates from the committed runs
        run: |
          python -m emlang.report --runs runs/main --out /tmp/report --ablations runs/ablations
          test -s /tmp/report/results.md
